# ============================================================
# AboveTheClouds V4 — Cloudflare Pages configuration
# ============================================================
name = "abovetheclouds"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "abovetheclouds"
database_id = "92f7d7ba-9e55-4afa-93f2-29f3396e4950"

[vars]
FLIGHT_DATA_PROVIDER = "opensky"
FLIGHT_API_BASE_URL = "https://opensky-network.org/api"

# Secrets must be configured in Cloudflare, never committed here:
#   wrangler pages secret put FLIGHT_API_CLIENT_ID
#   wrangler pages secret put FLIGHT_API_CLIENT_SECRET
