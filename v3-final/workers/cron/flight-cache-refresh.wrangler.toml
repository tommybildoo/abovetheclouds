# ============================================================
# Standalone Worker config — Live Flight Cache Refresh
# Deploy: wrangler deploy --config workers/cron/flight-cache-refresh.wrangler.toml
# ============================================================
name = "atc-flight-refresh"
main = "./flight-cache-refresh.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "abovetheclouds"
database_id = "92f7d7ba-9e55-4afa-93f2-29f3396e4950"

# Refresh once per minute. Authenticated OpenSky currently provides a
# much larger credit budget than anonymous access, so this cadence is
# appropriate for a live tracker while keeping visitor requests off the
# external API.
[triggers]
crons = ["*/1 * * * *"]

[vars]
FLIGHT_DATA_PROVIDER = "opensky"
FLIGHT_API_BASE_URL = "https://opensky-network.org/api"

# Secrets (set these on this Worker, never commit them):
#   wrangler secret put FLIGHT_API_CLIENT_ID --config workers/cron/flight-cache-refresh.wrangler.toml
#   wrangler secret put FLIGHT_API_CLIENT_SECRET --config workers/cron/flight-cache-refresh.wrangler.toml
