# ============================================================
# AboveTheClouds V3 — Cloudflare Pages configuration
# ============================================================
name = "abovetheclouds"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "abovetheclouds"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
preview_database_id = "DB"

# Live flight data is selected here. OAuth credentials are secrets and
# must be configured in Cloudflare, never committed to this file.
[vars]
FLIGHT_DATA_PROVIDER = "opensky"
FLIGHT_API_BASE_URL = "https://opensky-network.org/api"
